# Local development only; ports are bound to loopback.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-seniosk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in v2/.env}
      POSTGRES_DB: ${DB_NAME:-seniosk}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: container
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-seniosk}
      DB_USER: ${DB_USER:-seniosk}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in v2/.env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
